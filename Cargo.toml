[package]
name = "dash-spv-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Cross-platform Dash SPV wallet GUI"
license = "MIT"
repository = "https://github.com/xdustinface/dash-spv-ui"

[dependencies]
dashcore = { path = "../rust-dashcore/dash" }
dash-spv = { path = "../rust-dashcore/dash-spv" }
key-wallet = { path = "../rust-dashcore/key-wallet" }
key-wallet-manager = { path = "../rust-dashcore/key-wallet-manager" }

dioxus = { version = "0.7", features = ["desktop", "router"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
hex = "0.4"
tracing = "0.1"

[dev-dependencies]
