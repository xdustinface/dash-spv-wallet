name: Pre-commit

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Pre-commit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: awalber/cache-apt-pkgs-action@latest
        if: runner.os == 'Linux'
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev libudev-dev libxdo-dev
      - run: npm install
      - name: Install Dioxus CLI (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$HOME/.cargo/bin"
          curl -fsSL https://github.com/DioxusLabs/dioxus/releases/download/v0.7.3/dx-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$HOME/.cargo/bin"
          chmod +x "$HOME/.cargo/bin/dx"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install Dioxus CLI (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$HOME/.cargo/bin"
          curl -fsSL https://github.com/DioxusLabs/dioxus/releases/download/v0.7.3/dx-aarch64-apple-darwin.tar.gz \
            | tar -xz -C "$HOME/.cargo/bin"
          chmod +x "$HOME/.cargo/bin/dx"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install Dioxus CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/DioxusLabs/dioxus/releases/download/v0.7.3/dx-x86_64-pc-windows-msvc.zip" -OutFile dx.zip
          Expand-Archive -Path dx.zip -DestinationPath "$env:USERPROFILE\.cargo\bin" -Force
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files --hook-stage push --verbose
