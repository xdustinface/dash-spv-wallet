name: Sanitizer

on:
  push:
    branches: [main, dev]
  pull_request:
    paths:
      - 'src/backend/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  asan:
    name: Address Sanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev libudev-dev libxdo-dev
      - run: npm install

      - name: Run tests with ASAN
        env:
          RUST_BACKTRACE: 1
          RUSTFLAGS: "-Zsanitizer=address -Cdebuginfo=2 -Cforce-frame-pointers=yes"
          # detect_leaks=0: Dioxus VirtualDom leaks signals on drop (see #84)
          ASAN_OPTIONS: "symbolize=1:allow_addr2line=1:detect_leaks=0"
          SKIP_DASHD_TESTS: 1
        run: cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu --all-features --lib --tests

  tsan:
    name: Thread Sanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev libudev-dev libxdo-dev
      - run: npm install

      - name: Run tests with TSAN
        env:
          RUST_BACKTRACE: 1
          RUSTFLAGS: "-Zsanitizer=thread -Cdebuginfo=2"
          TSAN_OPTIONS: "second_deadlock_stack=1"
          SKIP_DASHD_TESTS: 1
        run: cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu --all-features --lib --tests
